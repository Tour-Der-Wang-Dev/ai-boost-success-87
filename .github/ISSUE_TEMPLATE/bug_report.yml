name: 🐛 Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: 🐛 Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: A clear description of what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: A clear description of what actually happened
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Screenshots/Videos
      description: If applicable, add screenshots or videos to help explain your problem
      placeholder: Drag and drop images or paste URLs here

  - type: dropdown
    id: browser
    attributes:
      label: 🌐 Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: 📱 Device Type
      description: What type of device are you using?
      options:
        - Desktop
        - Mobile
        - Tablet
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 💻 Operating System
      description: What operating system are you using?
      placeholder: e.g., Windows 11, macOS 13, Ubuntu 22.04, iOS 16, Android 13

  - type: input
    id: version
    attributes:
      label: 📦 Application Version
      description: What version of the application are you using?
      placeholder: e.g., 1.0.0, or the URL if using a web version

  - type: textarea
    id: console_logs
    attributes:
      label: 🔍 Console Logs
      description: |
        Please provide any relevant console logs/errors.
        1. Open browser developer tools (F12)
        2. Go to Console tab
        3. Reproduce the issue
        4. Copy any error messages
      placeholder: Paste console logs here...
      render: shell

  - type: textarea
    id: network_logs
    attributes:
      label: 🌐 Network Logs
      description: |
        If the issue is related to API calls or data loading:
        1. Open browser developer tools (F12)
        2. Go to Network tab
        3. Reproduce the issue
        4. Look for failed requests (red status codes)
        5. Share the details
      placeholder: Paste network error details here...

  - type: textarea
    id: additional_context
    attributes:
      label: 📝 Additional Context
      description: |
        Add any other context about the problem here.
        - Does this happen consistently or intermittently?
        - Any recent changes before the issue started?
        - Workarounds you've tried?
        - Related issues or links?
      placeholder: Any additional information...

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided clear steps to reproduce the issue
          required: true
        - label: I have included relevant screenshots/videos if applicable
          required: false
        - label: I have included console logs if there are JavaScript errors
          required: false
        - label: I have tested this on the latest version of the application
          required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 Priority Level
      description: How critical is this issue for your workflow?
      options:
        - Low - Minor inconvenience
        - Medium - Affects functionality but has workarounds
        - High - Blocks important functionality
        - Critical - Application unusable/data loss
    validations:
      required: true